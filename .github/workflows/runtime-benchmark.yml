name: Runtime benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/benchmark_runtime.py"
      - "uv.lock"
      - ".github/workflows/runtime-benchmark.yml"

permissions:
  contents: read

jobs:
  discovery:
    name: Measure catalog and discovery runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Benchmark
        run: |
          uv run python scripts/benchmark_runtime.py --samples 30 | tee runtime-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-benchmark
          path: runtime-benchmark.json
