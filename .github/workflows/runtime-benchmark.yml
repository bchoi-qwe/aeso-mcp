name: Runtime benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/benchmark_runtime.py"
      - "uv.lock"
      - ".github/workflows/runtime-benchmark.yml"

permissions:
  contents: read

jobs:
  discovery:
    name: Measure catalog and discovery runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.2"
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Benchmark
        run: |
          uv run python scripts/benchmark_runtime.py --samples 30 | tee runtime-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-benchmark
          path: runtime-benchmark.json
