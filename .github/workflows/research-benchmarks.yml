name: Research benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/research-benchmarks.yml"
      - "scripts/export_routing_benchmark.py"
      - "scripts/benchmark_model_routing.py"
      - "scripts/benchmark_csd_workload.py"
      - "tests/evals/holdout_routing.json"

permissions:
  contents: read

jobs:
  model-routing:
    name: CPU model routing holdout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Freeze tool descriptions and BM25 results
        run: |
          uv sync --locked --group dev
          uv run python scripts/export_routing_benchmark.py --output routing-manifest.json
      - name: Install isolated CPU inference environment
        run: |
          uv venv --python 3.13 .model-venv
          uv pip install --python .model-venv/bin/python --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0'
          uv pip install --python .model-venv/bin/python 'transformers==5.24.1'
          uv pip freeze --python .model-venv/bin/python > model-environment.txt
      - name: Run credential-free model
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: .model-venv/bin/python scripts/benchmark_model_routing.py --manifest routing-manifest.json --output model-routing.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-routing
          path: |
            routing-manifest.json
            model-environment.txt
            model-routing.json
  csd-workload:
    name: Full live CSD workload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Install locked analytics environment
        run: uv sync --locked --group dev --extra analytics
      - name: Benchmark complete archive
        run: |
          set -o pipefail
          uv run python scripts/benchmark_csd_workload.py | tee csd-workload.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csd-workload
          path: csd-workload.json
