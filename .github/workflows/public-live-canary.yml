name: AESO public live canary

on:
  pull_request:
    paths:
      - ".github/workflows/public-live-canary.yml"
      - "src/aeso_mcp/providers/historical_generation.py"
      - "src/aeso_mcp/providers/reports.py"
      - "tests/integration/test_live_aeso.py"
  schedule:
    - cron: "23 12 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-aeso-live
  cancel-in-progress: false

jobs:
  public-live:
    name: Credential-free live upstream checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
          enable-cache: false

      - name: Sync locked test dependencies
        run: uv sync --locked --group dev

      - name: Test public AESO sources without secrets
        env:
          AESO_MCP_HTTP_TOTAL_TIMEOUT_S: "90"
        run: |
          uv run pytest tests/integration/test_live_aeso.py -m "integration and public_live" -q -ra \
            --junitxml=public-live.xml

      - name: Record actual public canary results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-live-results
          path: public-live.xml
          if-no-files-found: error
