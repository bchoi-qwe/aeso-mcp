name: AESO live canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-canary.yml'
      - 'tests/integration/test_live_aeso.py'
  schedule:
    - cron: "17 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-canary:
    name: Authenticated upstream smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aeso-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      - name: Run bounded AESO live canary
        env:
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
        run: |
          if [ -z "$AESO_API_KEY" ]; then
            echo '::error::The protected aeso-live environment needs AESO_API_KEY.'
            exit 1
          fi
          uv run pytest tests/integration -m 'integration and not public_live' -q --tb=short --show-capture=no
