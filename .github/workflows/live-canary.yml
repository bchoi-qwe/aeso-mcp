name: AESO live canary

on:
  schedule:
    - cron: "17 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-canary:
    name: Short live upstream smoke
    runs-on: ubuntu-latest
    environment: aeso-live
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      - name: Run bounded AESO live canary
        env:
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
        run: uv run pytest tests/integration -m integration -q
