name: AESO live canary

on:
  schedule:
    - cron: "17 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-canary:
    name: Authenticated upstream smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aeso-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --locked --group dev

      - name: Run bounded AESO live canary
        env:
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
        run: uv run pytest tests/integration -m 'integration and not public_live' -q --tb=short
