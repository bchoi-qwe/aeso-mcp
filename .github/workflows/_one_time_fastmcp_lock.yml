name: One-time FastMCP lock refresh

on:
  push:
    branches:
      - maintenance/fastmcp-4-2-upgrade

permissions:
  contents: write

jobs:
  regenerate-lock:
    name: Update locked FastMCP dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv python install 3.13
      - name: Resolve dependencies
        run: uv lock --upgrade-package fastmcp --upgrade-package mcp
      - name: Push refreshed lock
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "Lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh locked FastMCP 4.2.0 dependency graph"
          git push origin HEAD:maintenance/fastmcp-4-2-upgrade
