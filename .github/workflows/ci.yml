name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Pyright
        run: uv run pyright src

      - name: Pytest with coverage
        env:
          AESO_API_KEY: test-ci-key-not-real
        run: >
          uv run pytest tests/unit tests/contract tests/mcp
          --cov=aeso_mcp --cov-report=term-missing --cov-report=xml

      - name: Build package
        run: uv build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  mcp-conformance:
    name: MCP conformance (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Avoid shared-cache lock contention with the quality job.
          enable-cache: false
          version: "0.12.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Start MCP HTTP server
        env:
          AESO_API_KEY: test-ci-key-not-real
        run: |
          uv run aeso-mcp --transport http --host 127.0.0.1 --port 8765 &
          echo $! > /tmp/aeso-mcp.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/mcp >/dev/null 2>&1 || curl -sf -X POST http://127.0.0.1:8765/mcp >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

      - name: Run official conformance suite
        run: |
          npx --yes @modelcontextprotocol/conformance@0.1.13 server \
            --url http://127.0.0.1:8765/mcp \
            --suite active \
            --expected-failures ./conformance-baseline.yml

      - name: Document conformance status
        if: always()
        run: |
          echo "Official MCP conformance is exercised in CI."
          echo "Application-server gaps are baselined in conformance-baseline.yml."

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aeso-mcp:ci .
