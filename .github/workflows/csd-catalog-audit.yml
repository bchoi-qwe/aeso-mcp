name: Public CSD catalog audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/csd-catalog-audit.yml"
      - "scripts/audit_csd_catalog.py"

permissions:
  contents: read

jobs:
  catalog:
    name: Inspect public CSD file coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Audit source metadata without credentials
        run: |
          set -o pipefail
          uv run python scripts/audit_csd_catalog.py | tee csd-catalog-audit.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csd-catalog-audit
          path: csd-catalog-audit.json
