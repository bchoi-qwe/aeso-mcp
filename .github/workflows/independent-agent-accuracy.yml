name: Independent agent-answer accuracy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/independent-agent-accuracy.yml"
      - "scripts/independent_agent_cases.py"
      - "scripts/independent_agent_fixture.py"
      - "scripts/benchmark_independent_agent.py"
      - "scripts/aggregate_independent_agent.py"
      - "tests/evals/test_independent_agent_accuracy.py"
      - "docs/independent-agent-accuracy.md"

permissions:
  contents: read

jobs:
  preflight:
    name: Validate independent fixtures and scoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Sync locked test environment
        run: uv sync --locked --group dev
      - name: Verify benchmark formatting and deterministic MCP fixture
        run: |
          uv run ruff check scripts tests/evals
          uv run ruff format --check scripts tests/evals
          uv run pytest -q tests/evals/test_independent_agent_accuracy.py

  model:
    name: Independent agent (${{ matrix.model }} / ${{ matrix.shard }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        model: ["0.5b", "1.5b", "3b"]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Install locked MCP and fixture dependencies
        run: uv sync --locked --group dev
      - name: Install isolated CPU model dependencies
        run: |
          uv venv --python 3.13 .model-venv
          uv pip install --python .model-venv/bin/python --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0'
          uv pip install --python .model-venv/bin/python 'transformers==5.24.1'
          uv pip freeze --python .model-venv/bin/python > model-environment.txt
      - name: Run model-selected real MCP calls and score independent oracle
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          MODEL_SIZE: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
        run: |
          .model-venv/bin/python scripts/benchmark_independent_agent.py --model-size "$MODEL_SIZE" --shard-index "$SHARD" --shard-count 6 --fixture-python .venv/bin/python --output independent-agent.json
      - name: Preserve trace and environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ matrix.model }}-${{ matrix.shard }}
          path: |
            independent-agent.json
            model-environment.txt

  aggregate:
    name: Verify full independent benchmark evidence
    needs: model
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-*
          path: shards
      - name: Fail on incomplete or conflicting model evidence
        run: |
          python -m scripts.aggregate_independent_agent --root shards --output independent-comparison.json
      - name: Publish complete score
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-agent-comparison
          path: independent-comparison.json
