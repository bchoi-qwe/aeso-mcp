name: Publish to PyPI

# Manual only. Do not publish until the package has been human-reviewed.
# See LIMITATIONS.md and CONTRIBUTING.md (Pre-PyPI checklist).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Validate locked release
        run: |
          uv sync --locked --group dev --extra analytics --extra docs
          uv run python tests/packaging/check_release_metadata.py
          uv run python tests/packaging/check_lock_prereleases.py
          uv audit --frozen
          uv run pytest tests/unit tests/contract tests/mcp tests/evals tests/packaging -q

      - name: Build
        run: uv build

      - name: Export runtime SBOM
        run: uv export --locked --all-extras --no-dev --format cyclonedx1.5 --output-file sbom.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'

      - name: Attest runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.json

      - name: Publish
        # Configure a PyPI Trusted Publisher for this workflow and the "pypi"
        # environment before running it. uv exchanges GitHub's OIDC identity for
        # a short-lived publishing credential; no permanent PyPI token is used.
        run: uv publish

      - name: Install exact release from PyPI
        run: |
          version="$(uv run --no-project --python 3.13 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          smoke_env="${RUNNER_TEMP}/aeso-mcp-pypi-smoke"
          uv venv --python 3.13 "$smoke_env"
          for attempt in $(seq 1 12); do
            if uv pip install --refresh --index-url https://pypi.org/simple \
              --python "$smoke_env/bin/python" "aeso-mcp==${version}"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "PyPI did not expose aeso-mcp==${version} after publication" >&2
              exit 1
            fi
            sleep 10
          done
          cd "$RUNNER_TEMP"
          AESO_API_KEY=pypi-smoke-key AESO_MCP_EXPECTED_VERSION="$version" \
            "$smoke_env/bin/python" "$GITHUB_WORKSPACE/tests/packaging/installed_wheel_smoke.py"
