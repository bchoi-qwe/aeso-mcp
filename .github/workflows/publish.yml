name: Publish to PyPI

# Manual only. Do not publish until the package has been human-reviewed.
# See LIMITATIONS.md and CONTRIBUTING.md (Pre-PyPI checklist).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Publish
        # Configure a PyPI Trusted Publisher for this workflow and the "pypi"
        # environment before running it. uv exchanges GitHub's OIDC identity for
        # a short-lived publishing credential; no permanent PyPI token is used.
        run: uv publish
