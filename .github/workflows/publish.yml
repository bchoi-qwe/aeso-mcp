name: Publish to PyPI

# Manual only. Do not publish until the package has been human-reviewed.
# See LIMITATIONS.md and CONTRIBUTING.md (Pre-PyPI checklist).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Publish
        # Configure a PyPI Trusted Publisher for this workflow and the "pypi"
        # environment before running it. uv exchanges GitHub's OIDC identity for
        # a short-lived publishing credential; no permanent PyPI token is used.
        run: uv publish

      - name: Install exact release from PyPI
        run: |
          version="$(uv run --no-project --python 3.13 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          smoke_env="${RUNNER_TEMP}/aeso-mcp-pypi-smoke"
          uv venv --python 3.13 "$smoke_env"
          for attempt in $(seq 1 12); do
            if uv pip install --refresh --index-url https://pypi.org/simple \
              --python "$smoke_env/bin/python" "aeso-mcp==${version}"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "PyPI did not expose aeso-mcp==${version} after publication" >&2
              exit 1
            fi
            sleep 10
          done
          cd "$RUNNER_TEMP"
          AESO_API_KEY=pypi-smoke-key AESO_MCP_EXPECTED_VERSION="$version" \
            "$smoke_env/bin/python" "$GITHUB_WORKSPACE/tests/packaging/installed_wheel_smoke.py"
