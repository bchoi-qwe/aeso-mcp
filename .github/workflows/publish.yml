name: Publish to PyPI

# Manual only. Do not publish until the package has been human-reviewed.
# See LIMITATIONS.md and CONTRIBUTING.md (Pre-PyPI checklist).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Publish
        # Prefer PYPI_TOKEN when set. Otherwise attempt Trusted Publisher (OIDC).
        # Configure either a repo secret PYPI_TOKEN or a PyPI Trusted Publisher
        # for environment "pypi" before running this workflow.
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "${UV_PUBLISH_TOKEN}" ]; then
            uv publish --token "$UV_PUBLISH_TOKEN"
          else
            echo "No PYPI_TOKEN secret; attempting Trusted Publisher (OIDC)."
            uv publish
          fi
