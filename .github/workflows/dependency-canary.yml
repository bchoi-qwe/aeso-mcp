name: Dependency canary

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Unlock MCP/FastMCP and retest
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked baseline first
        run: uv sync --locked --group dev

      - name: Attempt newer FastMCP/MCP beyond exact pin
        run: |
          # Exact pins in pyproject.toml prevent `uv lock --upgrade-package` from
          # seeing newer FastMCP prereleases. Rewrite to a lower-bound so the
          # canary can actually probe newer MCP stacks.
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          old = 'fastmcp==4.0.0b2'
          new = 'fastmcp>=4.0.0b2'
          if old not in text:
              raise SystemExit(f"Expected {old!r} in pyproject.toml")
          path.write_text(text.replace(old, new, 1))
          print(f"Rewrote dependency constraint: {old} -> {new}")
          PY
          uv lock --upgrade-package fastmcp --upgrade-package mcp
          uv sync --group dev
          uv pip show fastmcp mcp

      - name: Run tests against canary graph
        env:
          AESO_API_KEY: test-ci-key-not-real
        run: uv run pytest tests/unit tests/contract tests/mcp -q
