name: Dependency canary

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Unlock MCP/FastMCP and retest
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked baseline first
        run: uv sync --locked --group dev

      - name: Attempt newer FastMCP/MCP within policy
        run: |
          uv lock --upgrade-package fastmcp --upgrade-package mcp || true
          uv sync --group dev

      - name: Run tests against canary graph
        env:
          AESO_API_KEY: test-ci-key-not-real
        run: uv run pytest tests/unit tests/contract tests/mcp -q
