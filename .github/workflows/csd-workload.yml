name: Live CSD workload benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/csd-workload.yml"
      - "scripts/benchmark_csd_workload.py"
      - "src/aeso_mcp/providers/historical_generation.py"
      - "src/aeso_mcp/storage/history.py"

permissions:
  contents: read

jobs:
  csd-workload:
    name: Full CSD workload (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        resolution: ["hourly", "5-minute"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"
      - name: Install locked analytics environment
        run: uv sync --locked --group dev --extra analytics
      - name: Benchmark complete archive
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          set -o pipefail
          uv run python scripts/benchmark_csd_workload.py --resolution "$RESOLUTION" | tee csd-workload.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csd-workload-${{ matrix.resolution }}
          path: csd-workload.json
