name: Bug report
description: Report a defect in AESO MCP
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include tool name, inputs, and relevant logs (redact API keys).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or git commit
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I redacted AESO_API_KEY and other secrets from logs/output
          required: true
