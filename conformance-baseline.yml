# Expected MCP conformance failures for this application server.
#
# The official active suite targets "everything-server" capability demos
# (image/audio tools, prompts, elicitation, sampling, etc.). aeso-mcp is a
# domain MCP server: tools/resources for AESO data only. Failures below are
# intentionally unsupported surfaces, not protocol regressions.
#
# Format: https://github.com/modelcontextprotocol/conformance/blob/main/SDK_INTEGRATION.md

server:
  - completion-complete
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
  - dns-rebinding-protection
